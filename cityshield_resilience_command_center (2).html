    <style>
        /* Custom scrollbar for dense command center feel */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1F2937;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06B6D4;
        }
        
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
        .glass-panel-glow {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
        }
        
        .pulse-red {
            animation: pulse-red-anim 2s infinite;
        }
        @keyframes pulse-red-anim {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .pulse-cyan {
            animation: pulse-cyan-anim 2s infinite;
        }
        @keyframes pulse-cyan-anim {
            0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(6, 182, 212, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        /* Leaflet Dark Theme Overrides */
        .leaflet-container {
            background: #070A11 !important;
            font-family: 'Inter', sans-serif !important;
        }
        .leaflet-popup-content-wrapper {
            background: #111827 !important;
            color: #F3F4F6 !important;
            border: 1px solid #06B6D4;
            border-radius: 8px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
        }
        .leaflet-popup-tip {
            background: #111827 !important;
        }

        /* CV Bounding Box Animations */
        .cv-box {
            position: absolute;
            border: 2px solid #EF4444;
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            transition: all 0.3s ease;
        }
    </style>
</head>

            state.activeTab = tab;
            state.isLandingView = (tab === 'landing');
            renderApp();
            if (tab === 'map' || tab === 'overview') {
                setTimeout(initLeafletMap, 150);
            }
        }

        function renderApp() {
            const app = document.getElementById('app');
            
            if (state.isLandingView) {
                app.innerHTML = renderLandingPage();
                return;
            }

            app.innerHTML = `
                ${renderTopBar()}
                <div class="flex flex-1 overflow-hidden relative">
                    ${renderSidebar()}
                    <main class="flex-1 overflow-y-auto bg-navy-950 p-4 md:p-6 space-y-6 relative">
                        ${renderLiveTicker()}
                        ${renderMainTabContent()}
                    </main>
                </div>
                ${renderNotificationsDrawer()}
                ${renderSearchModal()}
            `;

                setTimeout(initLeafletMap, 100);
            }
            if (state.activeTab === 'analytics') {
                setTimeout(initAnalyticsCharts, 100);
            }

        let leafletMapInstance = null;
        function initLeafletMap() {
            const container = document.getElementById('gisMap');
            if (!container) return;

            if (leafletMapInstance) {
                leafletMapInstance.remove();
            }

            // Initialize map with Dark theme tile layer
            leafletMapInstance = L.map('gisMap', {
                center: NOVA_CITY_CENTER,
                zoom: 13,
                zoomControl: false
            });

            // Dark Matter Free Tiles
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(leafletMapInstance);

            L.control.zoom({ position: 'bottomright' }).addTo(leafletMapInstance);

            // Add Simulated Flood Polygon
            if (state.mapLayers.flood || state.simulation.active) {
                const floodPoly = L.polygon([
                    [40.7150, -74.0150],
                    [40.7250, -74.0120],
                    [40.7220, -73.9950],
                    [40.7100, -74.0050]
                ], {
                    color: state.simulation.active ? '#EF4444' : '#06B6D4',
                    fillColor: state.simulation.active ? '#EF4444' : '#06B6D4',
                    fillOpacity: state.simulation.active ? 0.45 : 0.25,
                    weight: 2
                }).addTo(leafletMapInstance);

                floodPoly.bindTooltip("Zone 4 - Flood Inundation Risk Area", { sticky: true });
            }

            // Add Markers
            CITY_MARKERS.forEach(item => {
                let color = '#06B6D4';
                if (item.severity === 'critical' || item.status === 'warning') color = '#EF4444';
                if (item.status === 'healthy') color = '#10B981';

                const customMarker = L.circleMarker([item.lat, item.lng], {
                    radius: 9,
                    fillColor: color,
                    color: '#FFFFFF',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(leafletMapInstance);

                customMarker.on('click', () => {
                    state.selectedMapItem = item;
                    renderApp();
                });
            });
        }
